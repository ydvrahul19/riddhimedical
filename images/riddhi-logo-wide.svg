<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b6e"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b3c"/>
      <stop offset="100%" style="stop-color:#2d9e5f"/>
    </linearGradient>
  </defs>
  <!-- Icon circle -->
  <circle cx="40" cy="40" r="36" fill="url(#bgG)"/>
  <circle cx="40" cy="40" r="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Cross vertical -->
  <rect x="33" y="18" width="14" height="44" rx="4" fill="white"/>
  <!-- Cross horizontal -->
  <rect x="18" y="33" width="44" height="14" rx="4" fill="white"/>
  <!-- Center dot -->
  <circle cx="40" cy="40" r="5" fill="url(#bgG)"/>
  <circle cx="40" cy="40" r="2.5" fill="#00e5b0"/>
  <!-- Leaf accent -->
  <ellipse cx="64" cy="16" rx="8" ry="5" fill="url(#lG)" transform="rotate(-35 64 16)"/>
  <ellipse cx="70" cy="11" rx="6" ry="4" fill="url(#lG)" transform="rotate(-35 70 11)"/>
  <!-- Brand text -->
  <text x="88" y="32" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#0d1b2a" letter-spacing="0.3">Riddhi Medical</text>
  <!-- Tagline -->
  <text x="89" y="52" font-family="Arial, sans-serif" font-weight="400" font-size="11" fill="#5a6a7a" letter-spacing="0.8">BHAGWANPURA, ALWAR</text>
  <!-- Thin underline accent -->
  <rect x="89" y="57" width="180" height="2" rx="1" fill="url(#lG)"/>
  <!-- Sub tagline -->
  <text x="89" y="70" font-family="Arial, sans-serif" font-size="9.5" fill="#888" letter-spacing="0.4">Your Trusted Health Partner</text>
</svg>
