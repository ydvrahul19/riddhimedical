<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b6e"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0f0ff"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b3c"/>
      <stop offset="100%" style="stop-color:#2d9e5f"/>
    </linearGradient>
  </defs>
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)"/>
  <!-- Subtle inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Medical cross - vertical bar -->
  <rect x="86" y="52" width="28" height="96" rx="7" fill="url(#crossGrad)"/>
  <!-- Medical cross - horizontal bar -->
  <rect x="52" y="86" width="96" height="28" rx="7" fill="url(#crossGrad)"/>
  <!-- Green leaf accent top-right -->
  <ellipse cx="148" cy="52" rx="14" ry="8" fill="url(#leafGrad)" transform="rotate(-40 148 52)"/>
  <ellipse cx="158" cy="44" rx="10" ry="6" fill="url(#leafGrad)" transform="rotate(-40 158 44)"/>
  <!-- Dot pulse center -->
  <circle cx="100" cy="100" r="10" fill="url(#bgGrad)" opacity="0.9"/>
  <circle cx="100" cy="100" r="5" fill="#00e5b0"/>
</svg>
